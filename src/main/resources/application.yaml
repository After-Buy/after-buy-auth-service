server:
  port: 8081
  forward-headers-strategy: framework

spring:
  application:
    name: AuthService
  # env 파일 내의 환경변수를 불러오는 설정 (확장자가 없으므로 properties 형식으로 강제 파싱)
  config:
    import: optional:file:.env[.properties]

  # 데이터베이스(MySQL) 연결 설정 (.env 환경변수 바인딩)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # JPA(Hibernate) 설정
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # AWS 연동 설정 (Spring Cloud AWS - 프로필 이미지 S3 Pre-signed URL 발급용) - 임시 주석 처리
  # cloud:
  #   aws:
  #     credentials:
  #       access-key: ${AWS_ACCESS_KEY}
  #       secret-key: ${AWS_SECRET_KEY}
  #     region:
  #       static: ${AWS_REGION}
  #     s3:
  #       bucket: ${AWS_S3_BUCKET}

# 내부 서비스 통신용 시크릿 키
internal:
  secret-key: ${INTERNAL_SECRET_KEY}

# 카카오 연동 설정
kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  token-url: ${KAKAO_TOKEN_URL:https://kauth.kakao.com/oauth/token}
  user-info-url: ${KAKAO_USER_INFO_URL:https://kapi.kakao.com/v2/user/me}

# 타 서비스 호출 URL (WebClient)
services:
  device-url: ${SERVICES_DEVICE_URL:http://localhost:8082}
  notification-url: ${SERVICES_NOTIFICATION_URL:http://localhost:8083}
  admin-url: ${SERVICES_ADMIN_URL:http://localhost:8084}

# JWT 설정
jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

# Swagger 설정 (Nginx 라우팅 규칙 반영)
springdoc:
  api-docs:
    path: /api/auth/v3/api-docs # OpenAPI JSON 경로
  swagger-ui:
    path: /api/auth/swagger-ui.html # Swagger 접속 경로
