plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.12'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.After_Buy'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 시스템 헬스 체크 및 모니터링 (Docker 컨테이너 생존 체크용)
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// 데이터베이스 ORM 및 엔티티 관리 (auth_db 연동)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// 카카오 소셜 로그인 연동을 위한 OAuth2 지원
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	// 전반적인 인증/인가 처리 및 통합 보안 필터 적용
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// DTO 파라미터 유효성 검사 (@Valid 등 적용)
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// REST API 엔드포인트 구축을 위한 필수 웹 프레임워크
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// 타 마이크로서비스 혹은 외부 API 요청용 비동기 클라이언트 (WebClient)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	// API 명세서 자동 생성 및 Swagger UI 제공
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'
	
	// 자체 인증 JWT 토큰 발급 및 검증 (Spring Boot 3 & Java 21)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

	// Getter, Setter, Builder 자동 생성 등 코드 다이어트 도구
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// AWS RDS MySQL 연결용 공식 JDBC 드라이버
	runtimeOnly 'com.mysql:mysql-connector-j'

	// 스프링 기본 통합 테스트 모듈 세트
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// WebFlux(WebClient) 관련 비동기 통신 로직 테스트용
	testImplementation 'io.projectreactor:reactor-test'
	// 권한 인가 등 시큐리티 설정 연관 로직 테스트용
	testImplementation 'org.springframework.security:spring-security-test'
	// JUnit5(Jupiter) 플랫폼 테스트 구동 엔진
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
